# Typesense for local development. Production runs on the VPS from deploy/typesense/docker-compose.yml
# (see docs/roadmap/typesense-ops.md).
#
#   docker compose -f docker-compose.typesense.yml up -d
#   yarn workspace @mtg/worker cli sync:typesense --rebuild
#
# Port 56325 keeps it in this project's own range, beside Supabase (API 56321, Postgres 56322, Studio 56323,
# Mailpit 56324), so it never collides with another local stack on the default ports.
#
# The data lives in a named volume rather than a bind mount: C: has no room on the Windows machine, and Docker
# Desktop's disk image is already on X: there, so the volume lands in the right place on both machines with no path
# to configure. It is a cache of Postgres either way — `sync:typesense --rebuild` recreates all of it.
services:
  typesense:
    image: typesense/typesense:29.0
    restart: unless-stopped
    ports:
      - "56325:8108"
    volumes:
      - typesense-data:/data
    command: >
      --data-dir /data
      --api-key=${TYPESENSE_LOCAL_KEY:-mtg-local-dev-key}
      --enable-cors
    # The image ships no curl and no wget — the obvious healthcheck marks a perfectly working container unhealthy
    # forever. It does ship bash, whose /dev/tcp can ask /health and read the answer.
    healthcheck:
      test:
        - CMD
        - bash
        - -c
        - 'exec 3<>/dev/tcp/127.0.0.1/8108 && printf "GET /health HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n" >&3 && grep -q ''"ok":true'' <&3'
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  typesense-data:
