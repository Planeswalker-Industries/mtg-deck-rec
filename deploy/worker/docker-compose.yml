# The worker on the VPS (apps/worker): one long-running `cli serve` that
#   - serves the deck lookups the web app queues (commander_requests), collecting decks into corpus.decks under
#     Archidekt's crawl claim, so it never presses the site while the daily crawl does;
#   - starts the daily Archidekt crawl through the search API;
#   - rebuilds the corpus stats from corpus.decks;
#   - refreshes EDHREC's commander pages weekly.
# When each of those is due lives in app_config.worker, read from the database, so a restart neither repeats nor skips
# work. Everything else the worker can do runs the same way:  docker compose run --rm worker <command>
#
#   cd deploy/worker
#   cp .env.example .env && $EDITOR .env
#   docker compose up -d --build
#   docker compose logs -f worker
#
# Deploy the search API first: the worker reaches it by name on the shared network.

name: mtg-worker

services:
  worker:
    build:
      context: ../..
      dockerfile: apps/worker/Dockerfile
    image: ${WORKER_IMAGE:-mtg-worker:local}
    restart: unless-stopped
    environment:
      # Supabase's **session** pooler (IPv4). The jobs stage rows in temp tables, which the transaction pooler drops.
      DATABASE_URL: "${DATABASE_URL:?set DATABASE_URL in .env: the Supabase session pooler connection string}"
      # The search API by name on the shared network: drains the search index after syncs and starts the crawl.
      SEARCH_API_URL: "${SEARCH_API_URL:-http://search-api:8080}"
      SEARCH_API_ADMIN_TOKEN: "${SEARCH_API_ADMIN_TOKEN:-}"
      SEARCH_API_CRON_TOKEN: "${SEARCH_API_CRON_TOKEN:-}"
      # Refreshes the web app's cached pages after a rebuild; without them caches expire on their own schedule.
      WEB_APP_URL: "${WEB_APP_URL:-}"
      REVALIDATE_SECRET: "${REVALIDATE_SECRET:-}"
    networks:
      - mtg-search
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  # The search stack's network (deploy/typesense creates it), where the search API answers as `search-api`.
  mtg-search:
    external: ${SEARCH_NETWORK_EXTERNAL:-true}
    name: ${SEARCH_NETWORK:-mtg-search}
