# Typesense on the VPS. Deployed on its own, separately from the API in front of it: a managed panel treats one
# compose file as one application, and these two have different lifecycles — the API is rebuilt whenever its Go
# code changes, while Typesense is a long-lived stateful container you only touch to upgrade it.
#
# They find each other over a shared Docker network you create once, by hand:
#
#   docker network create mtg-search
#
# External rather than created by whichever stack starts first: that way neither depends on the other's deploy
# order, and a missing network fails `up` loudly instead of quietly starting a container nothing can reach.
#
#   cd deploy/typesense
#   cp .env.example .env && $EDITOR .env      # TYPESENSE_ADMIN_KEY
#   docker compose up -d
#   docker compose ps                         # wait for "healthy"
#
# **This container publishes no port at all.** Nothing but search-api has any business reaching Typesense, and
# search-api reaches it by name on the shared network. Its API key is its entire access control and it terminates no
# TLS of its own, so exposing it would mean putting that key on the internet.
#
# Nothing here is a source of truth. Losing the volume costs one `sync:typesense --rebuild` and nothing else, which
# is also why there is no backup story: restoring from Postgres is faster and always correct.
#
# Full context in docs/roadmap/typesense-plan.md; the runbook is docs/roadmap/typesense-ops.md.

name: mtg-typesense

services:
  typesense:
    image: typesense/typesense:29.0
    restart: unless-stopped

    # A bind mount next to this file, not a named volume: on a server the data should be somewhere you can find,
    # back up if you ever want to, and see the size of without asking Docker.
    volumes:
      - ./data:/data

    # ${VAR:?message} refuses to start rather than silently booting with an empty key.
    command:
      - "--data-dir=/data"
      - "--api-key=${TYPESENSE_ADMIN_KEY:?set TYPESENSE_ADMIN_KEY in .env — see .env.example}"
      - "--listen-port=8108"
      # No --enable-cors: the only caller is search-api, server to server.

    networks:
      mtg-search:
        # An explicit alias, so `http://typesense:8108` resolves from the other stack no matter what that stack's
        # project is called. Compose adds the service name as an alias on its own networks; spelling it out here
        # means the API's configuration does not depend on that behaviour.
        aliases:
          - typesense

    # The image ships no curl and no wget, so the obvious healthcheck silently marks a working container unhealthy
    # forever. It does ship bash, whose /dev/tcp can speak just enough HTTP to ask /health and read the answer.
    healthcheck:
      test:
        - CMD
        - bash
        - -c
        - 'exec 3<>/dev/tcp/127.0.0.1/8108 && printf "GET /health HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n" >&3 && grep -q ''"ok":true'' <&3'
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

    # Typesense holds its index in RAM. The cap is a guard against one runaway collection taking the whole box down
    # with the rest of what the VPS runs; raise it as commander_cards grows (see the sizing note in the runbook).
    mem_limit: ${TYPESENSE_MEM_LIMIT:-1g}

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  mtg-search:
    external: true
    name: ${SEARCH_NETWORK:-mtg-search}
