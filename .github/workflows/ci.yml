name: CI

on:
  push:
    branches: [main, develop, "phase*/**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read # the ghcr.io sign-in before Start Supabase

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4

      # supabase_migrations.schema_migrations keys a migration by its timestamp prefix, so two files sharing one make
      # `supabase start` fail on the second. Two branches written the same day can each pass CI alone and only collide
      # once both are merged, which is how develop broke on 2026-09-22 — hence checking the prefixes, not the contents.
      - name: Unique migration versions
        run: |
          duplicates=$(ls supabase/migrations | cut -d_ -f1 | sort | uniq -d)
          if [ -n "$duplicates" ]; then
            echo "Migration versions used more than once:"; echo "$duplicates"
            echo "Rename the newer migration (the one not yet on main) to a free timestamp."
            ls supabase/migrations | grep -F "$duplicates"
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install
        run: |
          corepack enable
          yarn install --immutable

      - name: Typecheck
        run: yarn typecheck

      - name: Lint
        run: yarn lint

      - name: Unit tests
        run: yarn test

      - uses: supabase/setup-cli@v1
        with:
          version: 2.110.0

      # The CLI's image fallback below reaches ghcr.io; signed in with the job's own token, pulls there count against
      # this repo instead of the budget every shared runner draws on.
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Applies every migration to an empty database, so a migration that only works on top of local data fails here.
      #
      # Image registries refuse pulls now and then: ghcr.io with `toomanyrequests` on 2026-09-23, ECR Public with
      # `toomanyrequests: Data limit exceeded` on 2026-09-27. With SUPABASE_INTERNAL_IMAGE_REGISTRY unset, the CLI
      # (2.110.0, `GetRegistryImageUrls`) tries each image on ECR Public, then ghcr.io, then Docker Hub, so one registry
      # refusing no longer fails the run. Any value pins it to that one registry, and setup-cli exports ghcr.io, so the
      # step clears it. A start that still fails is retried after a pause, since these limits are per time window.
      - name: Start Supabase
        run: |
          unset SUPABASE_INTERNAL_IMAGE_REGISTRY
          for attempt in 1 2 3; do
            supabase start -x studio,imgproxy,realtime,storage-api,edge-runtime,logflare,vector,supavisor,mailpit && exit 0
            echo "supabase start failed (attempt $attempt), retrying in 30 s"
            supabase stop --no-backup || true
            sleep 30
          done
          exit 1

      - name: App environment
        run: |
          supabase status -o env \
            | sed -n 's/^API_URL=/NEXT_PUBLIC_SUPABASE_URL=/p; s/^PUBLISHABLE_KEY=/NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=/p' \
            | tr -d '"' >> "$GITHUB_ENV"
          echo "RATE_LIMIT_SALT=ci-only-not-secret" >> "$GITHUB_ENV"
          # The catalog is empty here, so the deck tool runs on mock recommendations; routes, proxy and pages stay real.
          echo "NEXT_PUBLIC_USE_MOCKS=1" >> "$GITHUB_ENV"

      - name: Build
        run: yarn workspace @mtg/web build

      - name: Install Playwright browser
        run: yarn workspace @mtg/web exec playwright install --with-deps chromium

      - name: End-to-end tests
        run: yarn workspace @mtg/web e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: apps/web/test-results
          retention-days: 7

  # The search API is Go and shares nothing with the yarn workspaces, so it gets its own job rather than making the
  # main one install a Go toolchain it otherwise has no use for. It needs no services: its tests fake Typesense.
  search-api:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: services/search-api
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache-dependency-path: services/search-api/go.sum

      - name: Vet
        run: go vet ./...

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "gofmt would change:"; echo "$unformatted"; exit 1
          fi

      - name: Test
        run: go test -race ./...

      - name: Build the image
        run: docker build -t mtg-search-api:ci .
